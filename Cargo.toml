[package]
name = "rust-viz"
version = "0.1.0"
edition = "2024"
description = "Run real Rust programs and watch the stack, heap, moves, borrows and drops happen, step by step, in your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jayeshbcodes/rust-viz"
readme = "README.md"
keywords = ["ownership", "borrowing", "visualizer", "learning", "tui"]
categories = ["development-tools", "visualization"]

[dependencies]
crossterm = "0.29.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
quote = "1.0.47"
